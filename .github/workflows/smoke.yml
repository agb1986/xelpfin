# Nightly end-to-end smoke test: scripts/smoke.sh drives a debug APK with D-pad events on an
# API 34 Android TV emulator against the local Jellyfin container, and the screenshots in
# docs/screens are uploaded as an artifact. The debug build embeds its JS bundle, so no Metro
# server is needed, and it is signed with the debug key, so no release secrets are used.
name: smoke

on:
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  JF_DIR: ${{ github.workspace }}/../jellyfin-test

jobs:
  smoke:
    name: smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20.19'
          cache: npm

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core python3-pil

      - name: Cache sample media
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.JF_DIR }}/media
          key: jellyfin-media-${{ hashFiles('scripts/gen-media.sh', 'scripts/*.py') }}

      - name: Install dependencies
        run: npm ci

      - name: Start and seed Jellyfin
        run: npm run jellyfin:up

      # The API 34 Android TV system image is x86 only, so build just that ABI.
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug -PreactNativeArchitectures=x86

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke test on the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: android-tv
          arch: x86
          profile: tv_1080p
          ram-size: 3072M
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          script: npm run smoke

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screens
          path: docs/screens
          if-no-files-found: warn
          retention-days: 14

      - name: Jellyfin log on failure
        if: failure()
        run: docker logs xelpfin-jellyfin 2>&1 | tail -n 200 || true
