# Builds the release APKs for a pushed vX.Y.Z tag with `npm run apk:release` (scripts/release.sh)
# and attaches them, with their R8 mapping files, to a GitHub release for the tag. The file names
# are the ones release.sh produces locally: dist/xelpfin-<version>-{arm,x86_64}.apk and
# dist/xelpfin-<version>-{arm,x86_64}-mapping.txt.
#
# The signing key comes from repository secrets and is written to signing/ on the runner only:
#   RELEASE_KEYSTORE_BASE64    base64 of signing/xelpfin-release.keystore (PKCS12)
#   RELEASE_KEYSTORE_PASSWORD  its store password
#   RELEASE_KEY_ALIAS          optional, defaults to xelpfin
#   RELEASE_KEY_PASSWORD       optional, defaults to the store password
# The job fails if the secrets are missing, so release.sh never generates a throwaway key here.
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20.19'
          cache: npm

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      # No cache writes from a release build, so a tag run cannot seed caches used elsewhere.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true

      - name: Check the tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match package.json version $version"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Write the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 and RELEASE_KEYSTORE_PASSWORD secrets are required"
            exit 1
          fi
          umask 077
          mkdir -p signing
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > signing/xelpfin-release.keystore
          {
            echo "storeFile=xelpfin-release.keystore"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=${KEY_ALIAS:-xelpfin}"
            echo "keyPassword=${KEY_PASSWORD:-$STORE_PASSWORD}"
          } > signing/keystore.properties

      - name: Build release APKs
        run: npm run apk:release

      - name: Remove the signing key
        if: always()
        run: rm -rf signing

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          files=(dist/xelpfin-"$version"-*.apk dist/xelpfin-"$version"-*-mapping.txt)
          ls -l "${files[@]}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" --verify-tag --title "$TAG" --generate-notes
          fi
